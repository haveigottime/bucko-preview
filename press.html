<!DOCTYPE html>
<html lang="en">
<head>
  <title>BUCKO — Press Kit</title>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div class="poster">
    <nav class="nav" data-nav></nav>
    <main class="inner">
      <section class="press-top">
        <img class="logo" src="assets/logo.png" alt="Bucko" width="320" height="320">
        <div class="lines" data-lines></div>
        <div data-press-hero></div>
        <div class="videos" data-pressvideos></div>
      </section>

      <hr class="rule">
      <h2 class="centre">A bit about us:</h2>
      <hr class="rule thin">
      <div class="about">
        <div class="text" data-bio></div>
        <div data-press-side></div>
      </div>
      <div data-press-gallery></div>

      <hr class="rule">
      <h2 class="centre" style="margin-bottom:22px">What people say about us:</h2>
      <div data-quotes></div>

      <div class="bar ffo" data-ffo></div>

      <hr class="rule">
      <h2 class="centre" style="margin-bottom:22px">Listen</h2>
      <div data-pressembed></div>

      <hr class="rule">
      <h2 style="margin-bottom:16px">Find us</h2>
      <div class="linkgrid" data-linkgrid></div>

      <hr class="rule">
      <h2 style="margin-bottom:16px">Photos &amp; assets</h2>
      <div data-downloads></div>
      <p class="btnrow" style="margin-top:14px"><button class="btn ghost" type="button" data-print>Save this page as PDF</button></p>

      <hr class="rule">
      <h2>Press &amp; bookings</h2>
      <p class="display" style="font-size:32px;margin-top:8px" data-email></p>
    </main>
    <footer class="bar" data-bar data-featured></footer>
  </div>
  <script src="js/site.js"></script>
</body>
</html>
